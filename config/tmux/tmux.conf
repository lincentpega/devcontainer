# devbox tmux config — repo-managed source of truth (config/tmux/)
# Mounted at /home/dev/.tmux.conf inside the box; the host can use the same
# file (D1: tmux runs host-side — copy/symlink to ~/.tmux.conf there).
#
# Goal: make pi (and other TUIs) behave properly under tmux:
#   - mouse events forwarded to the app (click-to-focus panes, click moves the
#     pi editor cursor, wheel scrolls pi in fullscreen mode, links clickable)
#   - modifier keys preserved (Shift+Enter / Ctrl+Enter / Alt+Enter no longer
#     collapse into plain Enter)
#   - in regular pi TUI mode, the wheel scrolls tmux's scrollback (copy mode)

# ---------------------------------------------------------------------------
# Mouse
# ---------------------------------------------------------------------------
# Without this, tmux never forwards mouse events to applications, so pi can't
# use the mouse at all (no click-to-focus, no cursor placement, no wheel
# scrolling in fullscreen mode, no clickable hyperlinks).
set -g mouse on

# ---------------------------------------------------------------------------
# Extended keys (modifier preservation)
# ---------------------------------------------------------------------------
# tmux strips modifier info from keys by default. With this on, when pi
# requests extended key reporting (it does automatically when the Kitty
# keyboard protocol isn't available), modified keys pass through instead of
# collapsing to legacy sequences (Shift+Enter -> plain Enter).
set -g extended-keys on

# tmux 3.5+: forward in CSI-u format — the most reliable for pi.
# tmux 3.2–3.4 fall back to xterm modifyOtherKeys, which pi also supports.
if-shell 'tmux -V | grep -Eq "3\.[5-9]|^tmux [4-9]"' \
    'set -g extended-keys-format csi-u'
