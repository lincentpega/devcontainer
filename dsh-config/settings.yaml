ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    # ChatGPT-Plus/Pro Codex subscription route, served through pi-ai's
    # installed openai-codex catalog (chatgpt.com/backend-api). Auth is the
    # stored OAuth grant at credential record llm-pi-ai/openai-codex, so no
    # apiKeyEnv is set; DeepSeek remains the default agent model.
    openai-codex:
      displayName: OpenAI Codex (ChatGPT subscription)
agent-presets:
  default: coding
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: high
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: deepseek-official
      model: deepseek-v4-flash-vision-exp
    - provider: deepseek-official
      model: deepseek-v4-flash
    - provider: openai-codex
      model: gpt-5.6-luna
    - provider: openai-codex
      model: gpt-5.6-terra
ui-theme:
  fontSize: 14
ui-chat:
  transcriptView: compact
llm-deepseek:
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      description: Fast, efficient, and economical; suited to focused, routine, or
        parallel tasks.
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      description: Stronger agentic coding, knowledge, and difficult reasoning; suited
        to complex or quality-critical tasks at higher cost.
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek-V4-Flash-Vision-Exp
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
    - id: deepseek-flash
      name: DeepSeek-V4-1-Flash
