# devbox — runtime configuration
# Security envelope: read-only rootfs, all caps dropped, seccomp default,
# non-root work (you log in as `dev`), loopback-only services, no docker.sock.
services:
  devbox:
    build: .
    container_name: devbox
    ports:
      - "2222:22"                # ssh — the single entry point
    volumes:
      # All paths are relative to this repo (compose resolves them against the
      # compose file's directory) — portable across machines.
      - ${WORKSPACE:-../}:/workspace:rw              # projects dir (repo's parent by default; override in .env)
      - ./config/nvim:/home/dev/.config/nvim:ro      # LazyVim config (repo)
      - ./config/pi/models.json:/home/dev/.pi/agent/models.json:ro  # pi config (repo)
      - devbox-home:/home/dev                        # state: auth, sessions, mason, meridian, claude
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    tmpfs:
      - /tmp
      - /run
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # sshd binds port 22 (<1024)
      - CHOWN              # entrypoint: home ownership
      - DAC_OVERRIDE       # entrypoint: write into dev's home volume
      - FOWNER             # entrypoint: chown semantics
      - SYS_CHROOT          # sshd preauth sandbox (chroot into /run/sshd)
      - SETGID              # sshd sandbox: setgroups/setgid
      - SETUID              # sshd sandbox: drop to nobody for preauth
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]

volumes:
  devbox-home:
